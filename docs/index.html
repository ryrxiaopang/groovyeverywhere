<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidden Gems · groovyeverywhere</title>
<!-- The live demo runs on our own computer behind a Cloudflare tunnel whose address changes when the tunnel restarts.
     This page is the stable link: change LIVE below (one line) and push; GitHub Pages serves it from master /docs. -->
<script>const LIVE = "https://alberta-yields-awarded-patricia.trycloudflare.com";</script>
<style>
  :root { --bg: #0b0813; --ink: #f6eef8; --muted: #b3a4c2; --accent: #ff8fb3; --accent-2: #ffb48a; }
  @media (prefers-color-scheme: light) { :root { --bg: #fbf1f4; --ink: #2b1a33; --muted: #6d5a78; --accent: #c2336f; --accent-2: #d9742f; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 400 17px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px 16px; }
  main { max-width: 560px; text-align: center; }
  h1 { font: 400 clamp(32px, 7vw, 52px)/1.1 Georgia, serif; margin: 0 0 10px; }
  h1 em { color: var(--accent); }
  p { color: var(--muted); margin: 0 0 18px; }
  a.btn { display: inline-block; padding: 13px 22px; border-radius: 12px; text-decoration: none; font-weight: 600; color: #1b0f1e;
          background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  small { display: block; margin-top: 18px; color: var(--muted); }
  small a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Hidden Gems<br><em>groovyeverywhere</em></h1>
  <p>Opening the live demo… Tell it a song you love and it finds songs that really sound like it.</p>
  <a class="btn" id="go" href="#">open the live demo</a>
  <small>The demo runs live on our own computer, one song at a time. If it does not open, it is offline right now:
    see the code on <a href="https://github.com/ryrxiaopang/groovyeverywhere">GitHub</a>.</small>
</main>
<script>
  document.getElementById("go").href = LIVE;
  setTimeout(() => { location.replace(LIVE); }, 900);
</script>
</body>
</html>
